<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QazconHub — Панель управления</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f2a4a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230f2a4a'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23ffb300'>Q</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-body">
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="logo-badge">Q</div>
        <div class="brand-text">
          <strong>QazconHub</strong>
          <span>Терминал</span>
        </div>
      </div>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="sidebar-user">
        <div class="user-avatar" id="userAvatar">?</div>
        <div class="user-meta">
          <strong id="userName">—</strong>
          <span id="userRole">—</span>
        </div>
        <button class="icon-btn" id="logoutBtn" title="Выйти">⏻</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn">☰</button>
        <h2 id="pageTitle">Обзор</h2>
        <div class="topbar-right">
          <span class="live-dot"></span><span class="live-text">Онлайн</span>
          <span class="clock" id="clock"></span>
        </div>
      </header>
      <div class="content" id="content"></div>
    </main>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" id="modalBox"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/dashboard-views.js"></script>
</body>
</html>
