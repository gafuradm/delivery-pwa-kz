<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QazconHub — Вход в систему</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f2a4a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230f2a4a'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23ffb300'>Q</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-badge">Q</div>
        <h1>QazconHub</h1>
        <p>Цифровая платформа логистического терминала</p>
      </div>
      <form id="loginForm" autocomplete="off">
        <label class="field">
          <span>Логин</span>
          <input type="text" id="login" placeholder="Например: admin" required>
        </label>
        <label class="field">
          <span>Пароль</span>
          <input type="password" id="pass" placeholder="••••••••" required>
        </label>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Войти</button>
        <div id="loginError" class="form-error" hidden></div>
      </form>
      <div class="login-hint">
        <strong>Демо-доступы:</strong>
        <div class="hint-grid">
          <span>admin / admin123</span>
          <span>director / director123</span>
          <span>dispatcher / disp123</span>
          <span>ppjt / ppjt123</span>
          <span>receiver / recv123</span>
          <span>crane / crane123</span>
          <span>guard / guard123</span>
          <span>client / client123</span>
          <span>driver / driver123</span>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    // Если уже авторизован — сразу в панель
    if (API.getToken()) window.location.href = '/dashboard.html';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errBox = document.getElementById('loginError');
      btn.disabled = true;
      btn.textContent = 'Вход...';
      errBox.hidden = true;
      try {
        const data = await API.post('/api/auth', {
          login: document.getElementById('login').value.trim(),
          pass: document.getElementById('pass').value
        });
        API.setToken(data.token);
        API.setUser(data.user);
        window.location.href = '/dashboard.html';
      } catch (err) {
        errBox.textContent = err.message;
        errBox.hidden = false;
        btn.disabled = false;
        btn.textContent = 'Войти';
      }
    });
  </script>
</body>
</html>
