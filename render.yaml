# Render Blueprint — QazconHub (бесплатный тариф)
# Документация: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: qazconhub-terminal
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Секрет JWT генерируется Render автоматически (безопасное случайное значение)
      - key: JWT_SECRET
        generateValue: true
